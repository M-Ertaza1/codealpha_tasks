<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account — Fieldnote</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Fieldnote</a>
      <nav class="main-nav">
        <a href="index.html">Feed</a>
        <span id="nav-auth-slot"><a href="login.html">Log in</a></span>
      </nav>
    </div>
  </header>

  <div class="auth-shell">
    <h2>Create your account</h2>
    <div id="form-error" class="form-error"></div>
    <form id="register-form">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" pattern="[a-z0-9_]+" minlength="3" placeholder="lowercase, no spaces" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="form-note">Already have an account? <a href="login.html" style="color:var(--wine);font-weight:600;">Log in</a></p>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
