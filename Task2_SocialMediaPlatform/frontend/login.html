<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Fieldnote</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Fieldnote</a>
      <nav class="main-nav">
        <a href="index.html">Feed</a>
        <span id="nav-auth-slot"><a href="login.html">Log in</a></span>
      </nav>
    </div>
  </header>

  <div class="auth-shell">
    <h2>Welcome back</h2>
    <div id="form-error" class="form-error"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="form-note">New here? <a href="register.html" style="color:var(--wine);font-weight:600;">Create an account</a></p>
    <p class="form-note" style="opacity:0.7;">Seeded demo login: amara@example.com / password123</p>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
